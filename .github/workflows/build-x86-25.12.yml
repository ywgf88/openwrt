name: x86 25.12

on:
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * *'

env:
  TZ: Asia/Shanghai
  CONFIG_FILE: config/x86-25.12.config
  UPLOAD_FIRMWARE: 'true'
  UPLOAD_RELEASE: 'true'

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Switch to openwrt v25.12.6
        run: |
          mkdir -p /tmp/custom
          cp config/x86-25.12.config /tmp/custom/x86-25.12.config
          cp feeds.conf.default /tmp/custom/feeds.conf.default
          git checkout v25.12.6
          mkdir -p config
          cp /tmp/custom/x86-25.12.config config/x86-25.12.config
          cp /tmp/custom/feeds.conf.default feeds.conf.default
          echo "=== source version ==="
          grep -E '^RELEASE|^VERSION' include/version.mk 2>/dev/null || true

      - name: Initialization environment
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget
          sudo timedatectl set-timezone "$TZ"
          df -h
          nproc

      - name: Show feeds configuration
        run: |
          echo "===== feeds.conf.default ====="
          cat feeds.conf.default

      - name: Update feeds
        run: ./scripts/feeds update -a

      - name: Install feeds
        run: ./scripts/feeds install -a

      - name: Remove conflicting packages
        run: |
          # 这些包自定义 group，若与源码 hardware-support 冲突会导致 defconfig 失败
          rm -rf package/feeds/packages/sane-backends
          rm -rf package/feeds/packages/tvheadend

      - name: Load custom configuration
        run: |
          cp "$CONFIG_FILE" .config
          make defconfig

      - name: Compile the firmware
        run: |
          make -j$(nproc) download
          make -j$(nproc) || make -j1 || make -j1 V=s

      - name: Organize files
        if: success()
        run: |
          cd bin/targets/x86/64
          ls -lh
          echo "== target files =="
          ls -1

      - name: Generate release tag
        id: tag
        if: success()
        run: |
          echo "release_tag=x86-25.12-$(date +'%Y.%m.%d-%H.%M')" >> $GITHUB_OUTPUT

      - name: Upload firmware to release
        if: success() && env.UPLOAD_RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          name: ${{ steps.tag.outputs.release_tag }}
          files: |
            bin/targets/x86/64/openwrt-*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
